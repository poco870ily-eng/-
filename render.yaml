services:
  - type: web
    name: linkvertise-antibypass-test
    runtime: python
    plan: free

    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --threads 4 --timeout 30

    healthCheckPath: /health

    envVars:
      - key: LINKVERTISE_URL
        value: https://link-hub.net/7774223/AvhFq6Fr49hN

      - key: LINKVERTISE_TOKEN
        sync: false

      - key: KEY_TTL_SECONDS
        value: "600"
